services:
  kyc-api:
    build: .
    container_name: northgate-kyc-api
    ports:
      - "8000:8000"
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://postgres:northgate-local-dev@postgres:5432/northgate_ekyc}
      SECRET_KEY: ${SECRET_KEY:-local-development-only-change-before-deployment}
      CORS_ALLOWED_ORIGINS: http://localhost:8000,http://127.0.0.1:8000
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  chaser-api:
    build:
      context: ./chaser-ts
    container_name: northgate-chaser-api
    ports:
      - "8001:8001"
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://postgres:northgate-local-dev@postgres:5432/northgate_ekyc
      SECRET_KEY: ${SECRET_KEY:-local-development-only-change-before-deployment}
      ALLOWED_ORIGINS: http://localhost:8000,http://127.0.0.1:8000
      PORT: 8001
      SEED_DEMO_DATA: "true"
    depends_on:
      postgres:
        condition: service_healthy
      kyc-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  postgres:
    image: postgres:16-alpine
    container_name: northgate-kyc-db
    environment:
      POSTGRES_DB: northgate_ekyc
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: northgate-local-dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d northgate_ekyc"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
