name: CI and Deploy

on:
  push:
    branches: [main, staging]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
        working-directory: backend
      - run: python -m pytest -q
        working-directory: backend

  typescript-chaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/chaser-ts/package-lock.json
      - run: npm ci
        working-directory: backend/chaser-ts
      - run: npm test
        working-directory: backend/chaser-ts

  docker:
    runs-on: ubuntu-latest
    needs: [python-api, typescript-chaser]
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the Compose stack
        run: |
          docker compose config --quiet
          docker compose up --build -d
        working-directory: backend
      - name: Wait for both APIs
        run: |
          for attempt in {1..120}; do
            if curl -fsS http://127.0.0.1:8000/ >/dev/null \
              && curl -fsS http://127.0.0.1:8001/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1
        working-directory: backend
      - name: Verify shared authentication and persisted chase workflow
        run: |
          curl -fsS -X POST http://127.0.0.1:8000/api/v1/auth/register \
            -H 'Content-Type: application/json' \
            -d '{"email":"ci-reviewer@example.com","full_name":"CI Reviewer","password":"StrongPass123!","role":"Reviewer"}' >/dev/null
          token=$(curl -fsS -X POST http://127.0.0.1:8000/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"ci-reviewer@example.com","password":"StrongPass123!"}' | jq -r .access_token)
          test -n "$token" && test "$token" != "null"
          cases=$(curl -fsS http://127.0.0.1:8001/api/cases -H "Authorization: Bearer $token")
          case_id=$(printf '%s' "$cases" | jq -r '[.[] | select(any(.documents[]; .receivedAt == null))][0].id')
          test -n "$case_id" && test "$case_id" != "null"
          curl -fsS -X PUT "http://127.0.0.1:8001/api/cases/$case_id/draft" \
            -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
            -d '{"draft":"CI-reviewed request"}' | jq -e '.draft == "CI-reviewed request"' >/dev/null
          updated=$(curl -fsS -X POST "http://127.0.0.1:8001/api/cases/$case_id/requests" \
            -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
            -d '{"manualSendConfirmed":true}')
          document=$(printf '%s' "$updated" | jq -r '[.documents[] | select(.receivedAt == null)][0].name')
          test -n "$document" && test "$document" != "null"
          encoded_document=$(printf '%s' "$document" | jq -sRr @uri)
          curl -fsS -X POST "http://127.0.0.1:8001/api/cases/$case_id/documents/$encoded_document/received" \
            -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
            -d '{}' | jq -e 'any(.documents[]; .receivedAt != null)' >/dev/null
        working-directory: backend
      - name: Stop Compose stack
        if: always()
        run: docker compose down --volumes
        working-directory: backend

  publish-images:
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    needs: [python-api, typescript-chaser, docker]
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Determine image tags and namespace
        id: meta
        run: |
          IMAGE_NAMESPACE="ghcr.io/$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE_NAMESPACE=$IMAGE_NAMESPACE" >> "$GITHUB_ENV"
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "image_tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "channel_tag=latest" >> "$GITHUB_OUTPUT"
          else
            echo "image_tag=staging-${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "channel_tag=staging" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@v3
      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish FastAPI image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/northgate-kyc-api:${{ steps.meta.outputs.image_tag }}
            ${{ env.IMAGE_NAMESPACE }}/northgate-kyc-api:${{ steps.meta.outputs.channel_tag }}
      - name: Publish TypeScript Document Chaser image
        uses: docker/build-push-action@v6
        with:
          context: ./backend/chaser-ts
          push: true
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/northgate-document-chaser-api:${{ steps.meta.outputs.image_tag }}
            ${{ env.IMAGE_NAMESPACE }}/northgate-document-chaser-api:${{ steps.meta.outputs.channel_tag }}

  deploy-staging:
    if: github.ref == 'refs/heads/staging' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    needs: [publish-images]
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/deploy-vm
        with:
          image_namespace: ghcr.io/${{ github.repository_owner }}
          image_tag: ${{ needs.publish-images.outputs.image_tag }}
          cloud_vm_host: ${{ secrets.CLOUD_VM_HOST }}
          cloud_vm_user: ${{ secrets.CLOUD_VM_USER }}
          cloud_vm_ssh_private_key: ${{ secrets.CLOUD_VM_SSH_PRIVATE_KEY }}
          cloud_vm_known_hosts: ${{ secrets.CLOUD_VM_KNOWN_HOSTS }}
          app_domain: ${{ secrets.APP_DOMAIN }}
          kyc_database_url: ${{ secrets.KYC_DATABASE_URL }}
          chaser_database_url: ${{ secrets.CHASER_DATABASE_URL }}
          secret_key: ${{ secrets.SECRET_KEY }}
          google_cloud_project: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
          gcs_bucket_name: ${{ secrets.GCS_BUCKET_NAME }}
          cloud_sql_instance: ${{ secrets.CLOUD_SQL_INSTANCE }}
          ghcr_username: ${{ secrets.GHCR_USERNAME }}
          ghcr_read_token: ${{ secrets.GHCR_READ_TOKEN }}
          allow_public_registration: ${{ vars.ALLOW_PUBLIC_REGISTRATION || 'false' }}
          seed_demo_data: ${{ vars.SEED_DEMO_DATA || 'false' }}

  deploy-production:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    needs: [publish-images]
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/deploy-vm
        with:
          image_namespace: ghcr.io/${{ github.repository_owner }}
          image_tag: ${{ needs.publish-images.outputs.image_tag }}
          cloud_vm_host: ${{ secrets.CLOUD_VM_HOST }}
          cloud_vm_user: ${{ secrets.CLOUD_VM_USER }}
          cloud_vm_ssh_private_key: ${{ secrets.CLOUD_VM_SSH_PRIVATE_KEY }}
          cloud_vm_known_hosts: ${{ secrets.CLOUD_VM_KNOWN_HOSTS }}
          app_domain: ${{ secrets.APP_DOMAIN }}
          kyc_database_url: ${{ secrets.KYC_DATABASE_URL }}
          chaser_database_url: ${{ secrets.CHASER_DATABASE_URL }}
          secret_key: ${{ secrets.SECRET_KEY }}
          google_cloud_project: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
          gcs_bucket_name: ${{ secrets.GCS_BUCKET_NAME }}
          cloud_sql_instance: ${{ secrets.CLOUD_SQL_INSTANCE }}
          ghcr_username: ${{ secrets.GHCR_USERNAME }}
          ghcr_read_token: ${{ secrets.GHCR_READ_TOKEN }}
          allow_public_registration: "false"
          seed_demo_data: "false"
